<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2Ticket</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #0b1220; /* fundo escuro — muda aqui se quiseres outra cor */
    overflow: hidden;
    cursor: none; /* esconde o cursor na TV */
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }

  /* halo azul atrás do logo, a "respirar" */
  .glow {
    position: absolute;
    width: 80vw;
    height: 60vh;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(24,116,239,0.28) 0%, rgba(24,116,239,0.10) 45%, transparent 70%);
    animation: breathe 6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1);    opacity: .7; }
    50%      { transform: scale(1.12); opacity: 1;  }
  }

  /* entrada do logo */
  .enter {
    animation: enter 1.1s cubic-bezier(.16, 1, .3, 1) both;
  }
  @keyframes enter {
    from { opacity: 0; transform: scale(.82); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* flutuação contínua */
  .float {
    animation: float 7s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-1.2vh); }
  }

  .logo {
    display: block;
    width: 62vw;
    max-height: 70vh;
    filter: drop-shadow(0 0 60px rgba(24, 116, 239, 0.35)); /* brilho suave à volta do logo */
  }

  /* bilhete azul: pequeno "pop" na entrada */
  .ticket {
    transform-box: fill-box;
    transform-origin: center;
    animation: pop .9s cubic-bezier(.16, 1, .3, 1) both;
  }
  @keyframes pop {
    from { transform: scale(.94); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  /* letras: entram uma a uma, a subir */
  .letter {
    transform-box: fill-box;
    transform-origin: center;
    opacity: 0;
    animation: rise .7s cubic-bezier(.16, 1, .3, 1) both;
    animation-delay: calc(.35s + var(--i) * .12s);
  }
  @keyframes rise {
    from { transform: translateY(28px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  /* picotado do bilhete: cintila suavemente */
  .dot {
    transform-box: fill-box;
    transform-origin: center;
    opacity: 0;
    animation:
      rise .6s cubic-bezier(.16, 1, .3, 1) both,
      twinkle 3.6s ease-in-out infinite;
    animation-delay: calc(.9s + var(--d) * .1s), calc(1.8s + var(--d) * .45s);
  }
  @keyframes twinkle {
    0%, 100% { opacity: 1; }
    50%      { opacity: .45; }
  }

  /* reflexo que varre o bilhete de tempos a tempos */
  .shine {
    animation: sweep 7s ease-in-out infinite;
    animation-delay: 2s;
  }
  @keyframes sweep {
    0%   { transform: translateX(-900px) skewX(-18deg); }
    32%  { transform: translateX(2700px) skewX(-18deg); }
    100% { transform: translateX(2700px) skewX(-18deg); }
  }

  /* aplicado por JS para reiniciar a sequência de entrada em loop */
  .enter.reset,
  .reset .ticket,
  .reset .letter,
  .reset .dot {
    animation: none !important;
    opacity: 0;
  }
</style>
</head>
<body>

          <!-- T -->
          <polygon class="letter" style="--i:6" fill="#fff" points="1547.8 144.53 1547.8 144.52 1500.18 144.52 1500.18 144.53 1419.93 144.53 1419.93 191.6 1420.23 192.15 1500.18 192.15 1500.18 441.22 1500.25 444.66 1547.8 444.66 1547.8 192.15 1628.01 192.15 1628.01 180.53 1628.06 180.53 1628.06 144.53 1547.8 144.53"/>

          <!-- reflexo a varrer o bilhete -->
          <g clip-path="url(#ticketClip)">
            <rect class="shine" x="0" y="-60" width="480" height="710" fill="url(#shineGrad)"/>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <script>
    // repete a sequência de entrada (pop + letras) em loop;
    // a flutuação e o halo continuam sem interrupção
    const CICLO = 12000; // ms entre cada repetição — ajusta aqui
    const enter = document.querySelector('.enter');
    setInterval(() => {
      enter.classList.add('reset');
      void document.body.offsetWidth; // força reflow para reiniciar as animações
      enter.classList.remove('reset');
    }, CICLO);
  </script>
</body>
</html>
